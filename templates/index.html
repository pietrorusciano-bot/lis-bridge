<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIS Bridge - Prototipo</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="theme-color" content="#1a73e8">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.6rem; }
    button { font-size: 1.2rem; padding: 14px 28px; border: none; border-radius: 8px; cursor: pointer; }
    #toggle { background: #d33; color: #fff; }
    #toggle.on { background: #2a2; }
    #live { background: #f4f4f4; border-radius: 8px; padding: 12px 16px; margin: 16px 0; min-height: 30px; color: #777; font-style: italic; }
    .turn { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 12px 0; background: #fafafa; }
    .speaker { font-weight: bold; color: #335; margin-bottom: 6px; }
    .turn .txt { color: #444; margin-bottom: 6px; }
    .turn .semplice { color: #777; font-style: italic; margin-bottom: 6px; }
    .turn .lis { background: #fef4e6; border: 1px solid #f0d8b0; border-radius: 6px; padding: 8px 10px; font-weight: bold; letter-spacing: 0.05em; }
    .turn .lis.pending { color: #999; }
    .empty { color: #999; }
  </style>
</head>
<body>
  <h1>LIS Bridge — Prototipo</h1>
  <p>Premi "Avvia", parla: la trascrizione appare in tempo reale e ogni frase viene tradotta in LIS.</p>

  <button id="toggle">Avvia</button>
  <div id="live" class="empty">In attesa...</div>

  <h2>Conversazione</h2>
  <div id="turns" class="empty">Nessuna trascrizione ancora.</div>

  <script>
    let socket = null;
    let audioContext = null;
    let processor = null;
    let stream = null;
    let running = false;
    let sentenceId = 0;

    const toggle = document.getElementById("toggle");
    const live = document.getElementById("live");
    const turns = document.getElementById("turns");

    toggle.addEventListener("click", () => {
      if (running) { stop(); } else { start(); }
    });

    async function start() {
      try {
        const res = await fetch("/api/stream_token");
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        });
        audioContext = new AudioContext();
        const rate = audioContext.sampleRate;

        const url = "wss://streaming.assemblyai.com/v3/ws?sample_rate=" + rate + "&speech_model=universal-3-5-pro&speaker_labels=true&language_codes=[%22it%22]&token=" + encodeURIComponent(data.token);
        socket = new WebSocket(url);

        socket.onopen = () => {
          const source = audioContext.createMediaStreamSource(stream);
          processor = audioContext.createScriptProcessor(4096, 1, 1);
          source.connect(processor);
          processor.connect(audioContext.destination);
          processor.onaudioprocess = (e) => {
            if (socket && socket.readyState === WebSocket.OPEN) {
              const input = e.inputBuffer.getChannelData(0);
              socket.send(floatTo16BitPCM(input));
            }
          };
          running = true;
          toggle.textContent = "Ferma";
          toggle.classList.add("on");
          live.textContent = "Ascolto...";
          live.classList.remove("empty");
        };

        socket.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === "Turn") {
            const text = msg.transcript || "";
            if (msg.end_of_turn && text) {
              live.textContent = "";
              const speaker = msg.speaker_label || "A";
              addTurn(speaker, text);
            } else if (text) {
              live.textContent = text;
            }
          }
        };

        socket.onerror = () => {
          live.textContent = "Errore WebSocket";
          stop();
        };

        socket.onclose = () => {
          if (running) stop();
        };
      } catch (err) {
        live.textContent = "Errore: " + err.message;
      }
    }

    function addTurn(speaker, text) {
      const id = ++sentenceId;
      const div = document.createElement("div");
      div.className = "turn";
      div.id = "turn-" + id;
      div.innerHTML =
        `<div class="speaker">Speaker ${speaker}</div>
         <div class="txt"></div>
         <div class="semplice"></div>
         <div class="lis pending">Traduzione LIS...</div>`;
      div.querySelector(".txt").textContent = text;
      turns.prepend(div);
      turns.classList.remove("empty");
      translateTurn(id, text);
    }

    async function translateTurn(id, text) {
      try {
        const res = await fetch("/api/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text }),
        });
        const data = await res.json();
        const div = document.getElementById("turn-" + id);
        if (!div) return;
        div.querySelector(".semplice").textContent = data.italiano || "";
        const lisBox = div.querySelector(".lis");
        lisBox.textContent = data.lis || (data.errore_lis ? "Errore LIS: " + data.errore_lis : "");
        lisBox.classList.remove("pending");
      } catch (err) {
        const div = document.getElementById("turn-" + id);
        if (div) div.querySelector(".lis").textContent = "Errore LIS: " + err;
      }
    }

    function floatTo16BitPCM(float32) {
      const int16 = new Int16Array(float32.length);
      for (let i = 0; i < float32.length; i++) {
        const s = Math.max(-1, Math.min(1, float32[i]));
        int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      return int16.buffer;
    }

    function stop() {
      running = false;
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: "Terminate" }));
      }
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      if (audioContext) { audioContext.close(); audioContext = null; }
      if (socket) { socket.close(); socket = null; }
      toggle.textContent = "Avvia";
      toggle.classList.remove("on");
      live.textContent = "In attesa...";
      live.classList.add("empty");
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/static/sw.js");
      });
    }
  </script>
</body>
</html>
